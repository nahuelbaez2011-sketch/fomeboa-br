name: Verificar Google Login FomeBoa
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/google-login-check.yml'
      - 'scripts/check-google-oauth.mjs'
permissions:
  contents: read
jobs:
  check-google:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar proveedor y redireccion sin registrar usuarios
        run: node scripts/check-google-oauth.mjs
