name: Catalogo gastronomico
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/catalogo.yml'
      - 'scripts/catalogo.py'
      - 'scripts/ampliar_catalogo.py'
      - 'catalogo/curados.json'
permissions:
  contents: write
concurrency:
  group: fomeboa-catalogo
  cancel-in-progress: false
jobs:
  catalogo:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - name: Install open-data readers
        run: python3 -m pip install --disable-pip-version-check 'duckdb>=1.1,<2' 'shapely>=2,<3'
      - name: Validate import and existing interface
        run: |
          python3 -m py_compile scripts/catalogo.py scripts/ampliar_catalogo.py
          python3 scripts/ampliar_catalogo.py --test
          node --check catalogo.js
          python3 scripts/catalogo.py --install
      - name: Expand shared catalogue from open data
        id: import
        continue-on-error: true
        run: |
          if [ ! -f catalogo/manifest.json ]; then
            python3 scripts/catalogo.py
          fi
          tar -czf /tmp/fomeboa-catalogo-before.tgz catalogo/
          if ! python3 -u scripts/ampliar_catalogo.py; then
            rm -rf catalogo/
            tar -xzf /tmp/fomeboa-catalogo-before.tgz
            exit 1
          fi
      - name: Report unsuccessful expansion without replacing data
        if: steps.import.outcome == 'failure'
        run: |
          echo '### Expansion no completada' >> "$GITHUB_STEP_SUMMARY"
          echo 'El catalogo anterior fue conservado. No se anuncia ningun incremento.' >> "$GITHUB_STEP_SUMMARY"
      - name: Save catalogue and interface
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html catalogo/
          if ! git diff --cached --quiet; then
            git commit -m 'Expand shared food catalogue with source-labelled open data'
            git push origin HEAD:main
          fi
      - name: Publishing note
        run: |
          echo '### Publicacion' >> "$GITHUB_STEP_SUMMARY"
          echo 'Resultados guardados en main. Un commit normal posterior publica Pages cuando se usa la rama.' >> "$GITHUB_STEP_SUMMARY"
