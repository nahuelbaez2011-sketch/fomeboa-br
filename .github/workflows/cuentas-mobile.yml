name: Verificar cuentas y empaquetado móvil
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cuentas-mobile.yml'
      - 'auth.js'
      - 'extras.js'
      - 'community.js'
      - 'community-locale.js'
      - 'community.css'
      - 'i18n.js'
      - 'community.js'
      - 'community-locale.js'
      - 'community.css'
      - 'scripts/test-community.cjs'
      - 'scripts/test-i18n.cjs'
      - 'auth-config.js'
      - 'supabase/schema.sql'
      - 'index.html'
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/preparar-mobile.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check account scripts
        run: |
          node --check auth.js
          node --check extras.js
          node --check community.js
          node --check community-locale.js
          node --check i18n.js
          node --check community.js
          node --check community-locale.js
          node scripts/test-i18n.cjs
          if grep -q 'community.js?v=community1' index.html; then node scripts/test-community.cjs; fi
          node --check auth-config.js
          node --check catalogo.js
          node --check scripts/preparar-mobile.mjs
      - name: Validate safe defaults and mobile config
        run: |
          node - <<'JS'
          const fs=require('node:fs');const assert=require('node:assert/strict');
          const h=fs.readFileSync('index.html','utf8');
          const a=fs.readFileSync('auth.js','utf8');
          const config=fs.readFileSync('auth-config.js','utf8');
          const schema=fs.readFileSync('supabase/schema.sql','utf8');
          assert(h.includes('<head>')&&h.includes('</head>')&&/auth\.js\?v=(google-first1|community1)/.test(h));
          assert(h.includes('auth-config.js?v=google-first1'));
          assert(h.includes('extras.js?v=features2')&&h.includes('community.js?v=features2'));
          assert(fs.readFileSync('extras.js','utf8').includes('navigator.geolocation.getCurrentPosition'));
          assert(fs.readFileSync('community.js','utf8').includes('fomeboa-review-photos'));
          assert(fs.readFileSync('community-locale.js','utf8').includes('first_photo'));
          assert(a.includes('supabase.createClient')&&a.includes('auth.signUp')&&a.includes('auth.signInWithPassword'));
          assert(a.includes('auth.resetPasswordForEmail')&&a.includes('auth.signOut'));
          assert(a.includes("signInWithOAuth({provider:'google'"));
          assert(a.includes('fomeboaGateGoogle'));
          assert(a.includes('googleReady=settings.external?.google===true'));
          assert(a.includes('redirectUrl'));
          assert(/url:\s*"https:\/\/[^\"]+\.supabase\.co"/.test(config));
          assert(/publishableKey:\s*"sb_publishable_/.test(config));
          assert(config.includes('webRedirectUrl'));
          assert(!/sb_secret_|service_role\s*:/.test(config.replace(/\/\*[\s\S]*?\*\//g,'')));
          assert(schema.includes('enable row level security'));
          assert(schema.includes('grant update (display_name)'));
          assert(schema.includes('revoke all on table public.fomeboa_profiles'));
          const pkg=require('./package.json');const capacitor=require('./capacitor.config.json');
          assert(pkg.scripts['build:mobile']&&capacitor.appId==='com.fomeboa.sp');
          JS
      - name: Prepare mobile web bundle
        run: |
          node scripts/preparar-mobile.mjs
          test -f www/index.html
          test -f www/auth.js
          test -f www/i18n.js
          test -f www/catalogo/manifest.json
          test -f www/distritos-sp.geojson
      - name: Report
        run: echo 'Account UI and shared assets checked. Real records use Supabase RLS; no new native release or store submission.' >> "$GITHUB_STEP_SUMMARY"
