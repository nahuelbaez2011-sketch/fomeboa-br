name: Corregir enlaces de negocios
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-location-links.yml'
      - 'scripts/fix_location_links.py'
permissions:
  contents: write
concurrency:
  group: fomeboa-location-link-fix
  cancel-in-progress: false
jobs:
  corregir:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - name: Patch both location link renderers and test
        run: python3 scripts/fix_location_links.py
      - name: Verify imported catalog was not changed
        run: git diff --exit-code -- catalogo/ distritos-sp.geojson
      - name: Save validated links
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html catalogo.js
          if ! git diff --cached --quiet; then
            git commit -m 'Open named Google business listings instead of imported coordinate pins'
            git push origin HEAD:main
          fi
